[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "the-forge"
version = "0.1.0"
description = "The Forge — a refuse-a-confident-wrong-answer harness (checkpoint loop + measuring panel) for SAFE-native AI app building"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
